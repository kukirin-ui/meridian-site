<!DOCTYPE html>

<head>

<meta name="description" content="Explore Meridian: the living Core menu from the app. Tap a world to see how each Meridian app works, step by step, and download it.">

<style>
/* The menu: the same WebGL code and styles as Meridian Core (js/core/hub.js, copied unchanged from the app). */
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
 font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eef3ff}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#nogl{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;padding:24px}
#labels{position:fixed;inset:0;pointer-events:none;transition:opacity .35s}
.plabel{position:absolute;transform:translateX(-50%);font-size:10.5px;font-weight:600;letter-spacing:.26em;text-indent:.26em;color:#fff;opacity:.95;text-shadow:0 0 1px #000,0 0 3px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.9),0 0 18px rgba(0,0,0,.75);white-space:nowrap}
#labels .core{font-size:12px;font-weight:700;opacity:1;letter-spacing:.45em;text-indent:.45em;color:#2a1604;text-shadow:0 0 10px rgba(255,255,255,.9)}
#overlay{position:fixed;inset:0;pointer-events:none}
#overlay.hide-labels~#labels{opacity:0}
#overlay #bar,#overlay #modwrap{display:none}

/* site bar */
:root{--cyan:#48d8ff;--violet:#b45cff;--ink:#eef3ff;--mute:#9aa6c8;--line:rgba(160,190,255,.16);--display:"Rajdhani","Arial Narrow",system-ui,sans-serif}
.bar{position:fixed;z-index:20;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;
 padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));
 background:linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,0));transition:opacity .35s}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{width:42px;height:24px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(72,216,255,.55))}
.brand b{font:700 18px/1 var(--display);letter-spacing:.32em}
.here{font:600 12px/1 var(--display);letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);white-space:nowrap}
.sp{flex:1}
.toplinks{display:flex;gap:14px}
.toplinks a{font:600 13px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);text-decoration:none}
.toplinks a:hover{color:var(--ink)}
@media (max-width:560px){.toplinks a:not(.home){display:none}.here{font-size:11px;letter-spacing:.16em}}
@media (max-width:380px){.bar{gap:9px}.brand b{display:none}}
.hint{position:fixed;z-index:3;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;margin:0;padding:0 16px;
 font:600 12px/1.4 var(--display);letter-spacing:.2em;text-transform:uppercase;color:rgba(238,243,255,.72);text-shadow:0 0 8px #000;pointer-events:none;transition:opacity .35s}
body.gal-open .bar,body.gal-open .hint{opacity:0;pointer-events:none}

/* gallery: one step per screen, sideways */
#gal{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .45s ease;
 background:radial-gradient(120% 80% at 50% 0%,rgba(40,20,90,.55),rgba(0,0,0,.94) 60%),#000}
#gal.on{opacity:1;pointer-events:auto}
.ghead{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
.gback{height:38px;padding:0 16px 0 12px;border-radius:19px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;
 font:600 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.gtitle{font:700 13px/1 var(--display);letter-spacing:.34em;text-transform:uppercase;color:rgba(238,243,255,.8)}
.gcount{margin-left:auto;font:600 12px/1 var(--display);letter-spacing:.2em;color:var(--mute)}
/* the colour line: grows out from the centre both ways when a gallery opens, a light runs along it with every swipe */
.rail{position:relative;height:5px;margin:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));border-radius:3px;overflow:hidden}
.rail i{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.rail i.l{right:50%;transform-origin:100% 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--violet),var(--cyan))}
.rail i.r{left:50%;transform-origin:0 50%;transform:scaleX(0)}
#gal.on .rail i{transform:scaleX(1)}
.rail b{position:absolute;top:0;bottom:0;width:28%;left:-30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);opacity:0}
.rail b.go-r{animation:runR .75s cubic-bezier(.4,0,.2,1)}
.rail b.go-l{animation:runL .75s cubic-bezier(.4,0,.2,1)}
/* until the first swipe: every few seconds the light runs to the right and an arrow pulses at the edge */
.nudge{position:fixed;z-index:31;right:max(8px,env(safe-area-inset-right));top:50%;width:40px;height:40px;margin-top:-20px;display:grid;place-items:center;
 border-radius:50%;color:#fff;font-size:26px;line-height:1;pointer-events:none;opacity:0;background:radial-gradient(rgba(72,216,255,.35),transparent 70%)}
.nudge.go{animation:nudge 1.4s ease-in-out}
@keyframes nudge{0%{opacity:0;transform:translateX(-10px)}35%{opacity:1;transform:translateX(4px)}70%{opacity:.9;transform:translateX(-2px)}100%{opacity:0;transform:translateX(8px)}}
@keyframes runR{0%{left:-30%;opacity:1}100%{left:102%;opacity:1}}
@keyframes runL{0%{left:102%;opacity:1}100%{left:-30%;opacity:1}}
.prog{display:flex;gap:6px;margin:10px max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
.prog button{flex:1;height:3px;padding:0;border:0;border-radius:2px;background:rgba(255,255,255,.18);cursor:pointer}
.prog button.on{background:linear-gradient(90deg,var(--cyan),var(--violet))}
.track{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overscroll-behavior-y:contain;
 display:grid;grid-template-columns:1fr;gap:18px;align-content:start;padding:18px max(18px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom,0px) + 28px) max(18px,env(safe-area-inset-left));box-sizing:border-box}
.slide .txt{order:-1}   /* phone: read the step, then see it */
@media (max-width:859px){   /* the picture takes the room the text leaves, so nothing scrolls down */
 .slide{display:flex;flex-direction:column;gap:14px}
 .slide .shots{flex:1 1 0;min-height:160px;display:flex;justify-content:center}
 .slide .shots figure{height:100%;display:flex;flex-direction:column;align-items:center}
 .slide .shots img{flex:1 1 0;min-height:0;max-height:none;object-fit:contain}
}
.txt .k{font:700 12px/1 var(--display);letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
.txt h2{margin:8px 0 10px;font:700 clamp(26px,6.4vw,40px)/1.05 var(--display);letter-spacing:.01em}
.txt p{margin:0 0 10px;font-size:15px;line-height:1.6;color:rgba(238,243,255,.86)}
.txt ol{margin:0 0 10px;padding-left:20px;font-size:15px;line-height:1.6;color:rgba(238,243,255,.86)}
.shots{display:grid;grid-template-columns:1fr;gap:14px;justify-items:center}
.shots figure{margin:0;max-width:100%}
.shots img{display:block;height:auto;width:auto;max-width:100%;max-height:calc(100svh - 300px);margin:0 auto;border-radius:22px;border:1px solid rgba(160,190,255,.22);box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4)}
.shots figcaption{margin-top:8px;text-align:center;font:600 11px/1.3 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
@media (min-width:860px){
 .slide{grid-template-columns:1.25fr minmax(300px,.75fr);align-content:center;align-items:center;gap:40px;padding-left:max(48px,6vw);padding-right:max(48px,6vw)}
 .slide .txt{order:0}
 .shots{display:flex;gap:22px;justify-content:center;align-items:flex-start}
 .shots figure{width:auto}
 .shots figure{flex:0 0 auto}
 .shots img{height:min(64vh,640px,34vw);width:auto;max-width:none}   /* every screenshot at the same height, side by side */
}
.arrow{display:none}
@media (min-width:860px) and (hover:hover){
 .arrow{display:grid;place-items:center;position:fixed;z-index:31;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;border:1px solid rgba(255,255,255,.22);
  background:rgba(10,8,26,.6);color:#fff;font-size:24px;cursor:pointer}
 .arrow.l{left:14px}.arrow.r{right:14px}.arrow[disabled]{opacity:.25;cursor:default}
}
.dl{display:grid;gap:12px;max-width:520px}
.dlbtn{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 26px;border-radius:26px;border:0;text-decoration:none;
 background:linear-gradient(90deg,var(--cyan),var(--violet));color:#05030c;font:700 15px/1 var(--display);letter-spacing:.18em;text-transform:uppercase}
.dlbtn.off{background:rgba(255,255,255,.1);color:rgba(238,243,255,.7);border:1px solid rgba(255,255,255,.2);pointer-events:none}
.dlmeta{font-size:12.5px;line-height:1.55;color:var(--mute);overflow-wrap:anywhere}
.dlmeta code{font-size:11.5px;color:rgba(238,243,255,.8)}
.beta{display:inline-block;margin-left:8px;padding:3px 8px;border-radius:10px;border:1px solid rgba(72,216,255,.5);font:700 10px/1 var(--display);letter-spacing:.18em;color:var(--cyan);vertical-align:middle}
/* Inside a world: its living picture is behind the steps (world.html in a frame, the app's own engine), the steps sit
   on glass, and the lines, counters and buttons take the world's colour (--w, --w2, set when it opens). */
#gal{--w:#48d8ff;--w2:#b45cff;--wrgb:72,216,255}
#wfx{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:0;opacity:0;transform:scale(1.07);pointer-events:none;
 transition:opacity 1.1s ease,transform 1.8s cubic-bezier(.2,.7,.2,1)}
#gal.live #wfx{opacity:1;transform:none}
.gveil{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 1.1s ease;
 background:linear-gradient(rgba(5,3,12,.78) 0,rgba(5,3,12,.18) 22%,rgba(5,3,12,.1) 45%,rgba(5,3,12,.55) 78%,rgba(5,3,12,.86) 100%),
  radial-gradient(90% 60% at 50% 100%,rgba(var(--wrgb),.16),transparent 70%)}
#gal.live .gveil{opacity:1}
#gal>.ghead,#gal>.rail,#gal>.prog,#gal>.track{position:relative;z-index:2}
.gtitle{display:flex;align-items:baseline;gap:9px;min-width:0;letter-spacing:.24em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtitle i{font-style:normal;color:var(--w);letter-spacing:.2em}
.gback{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.rail i{background:linear-gradient(90deg,var(--w),var(--w2))}
.rail i.l{background:linear-gradient(90deg,var(--w2),var(--w))}
.prog button.on{background:linear-gradient(90deg,var(--w),var(--w2));box-shadow:0 0 10px -1px rgba(var(--wrgb),.9)}
.gcount{color:rgba(238,243,255,.8)}
.txt .k,.shots figcaption{color:var(--w)}
.slide .txt{padding:18px 18px 10px;border-radius:22px;border:1px solid rgba(var(--wrgb),.26);
 background:linear-gradient(160deg,rgba(14,10,34,.72),rgba(6,4,16,.6));backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);
 box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07)}
.shots img{border-color:rgba(var(--wrgb),.4);box-shadow:0 14px 44px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.4),0 0 38px -8px rgba(var(--wrgb),.55)}
.dlbtn{background:linear-gradient(90deg,var(--w),var(--w2))}
.beta{border-color:rgba(var(--wrgb),.6);color:var(--w)}
.nudge{background:radial-gradient(rgba(var(--wrgb),.4),transparent 70%)}
/* a step with no picture yet: the world itself is the picture, the words sit low */
.slide.bare .shots{display:none}
.slide.bare .txt{order:1;margin-top:auto}
.slide.bare .txt h2{text-shadow:0 0 26px rgba(var(--wrgb),.5)}
@media (min-width:860px){.slide.bare{grid-template-columns:minmax(0,560px);align-content:end;justify-content:start;padding-bottom:9vh}}
/* each step's words rise in when its screen arrives */
.slide .txt>*{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.slide.in .txt>*{opacity:1;transform:none}
.slide.in .txt>*:nth-child(2){transition-delay:.06s}.slide.in .txt>*:nth-child(3){transition-delay:.13s}.slide.in .txt>*:nth-child(4){transition-delay:.2s}.slide.in .txt>*:nth-child(n+5){transition-delay:.27s}
.slide .shots img{opacity:0;transform:translateY(18px) scale(.97);transition:opacity .6s ease .1s,transform .8s cubic-bezier(.2,.7,.2,1) .1s}
.slide.in .shots img{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rail i{transition:none}.rail b{animation:none!important}#wfx,.gveil{transition:none}#wfx{transform:none}.slide .txt>*,.slide .shots img{opacity:1;transform:none;transition:none}}
html.still #wfx,html.still .gveil{transition:none}html.still #wfx{transform:none}html.still .slide .txt>*,html.still .slide .shots img{opacity:1;transform:none;transition:none}
html.still .rail i{transition:none}html.still .nudge{display:none}html.still .rail b{animation:none!important}html.still #gal{transition:none}
</style>

(function () {
  try {
    var site = JSON.parse(localStorage.getItem("meridian-site3") || "{}") || {}, p = JSON.parse(localStorage.getItem("m-prefs") || "{}") || {};
    if (site.motion && p.motion !== site.motion) { p.motion = site.motion; localStorage.setItem("m-prefs", JSON.stringify(p)); }
    var off = (site.motion || p.motion) === "off" || (!(site.motion || p.motion) || (site.motion || p.motion) === "system") && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (off) document.documentElement.classList.add("still");
  } catch (e) {}
})();
